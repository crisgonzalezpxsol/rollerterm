# Compila la versión Tauri en macOS y en Linux en cada push, para enterarse si algo se rompe
# en el sistema que no se está usando. En macOS además arma la .app y la deja para bajar.
name: build

on:
  push:
    branches: [main, spike/tauri]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      # Sin scripts: el postinstall recompila node-pty para Electron, que acá no hace falta.
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit -p app
      - run: npm run build
      - name: El binario arranca (modo servidor MCP, sin ventana)
        run: |
          out=$(printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            | app/src-tauri/target/release/rollerterm-tauri --mcp | head -1)
          echo "$out"
          echo "$out" | grep -q '"serverInfo"'
      - name: Armar e instalar la .app
        run: sh app/install-macos.sh
      - run: ditto -c -k --keepParent "/Applications/rollerterm Tauri.app" rollerterm-tauri-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: rollerterm-tauri-macos
          path: rollerterm-tauri-macos.zip

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit -p app
      - run: npm run build
