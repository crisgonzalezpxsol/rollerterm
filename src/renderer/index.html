<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <title>rollerterm</title>
    <link rel="stylesheet" href="renderer.css" />
  </head>
  <body>
    <header id="titlebar">
      <img class="app-logo" src="logo.svg" alt="" />
      <span class="app-name">rollerterm</span>
      <div id="prod"></div>
      <div id="pomodoro"></div>
      <button id="toggle-assistant" title="Asistente (⌘⇧K)">💬</button>
      <button id="toggle-notes" title="Notas (⌘⇧N)">📝</button>
      <button id="toggle-mute" title="Silenciar sonidos y avisos (⌘⇧M)">🔔</button>
      <button id="open-settings" title="Configuración (⌘,)">⚙</button>
    </header>
    <div id="top">
      <div id="left">
        <section id="agenda"></section>
        <section id="tickets"></section>
      </div>
      <section id="mail"></section>
    </div>
    <div id="splitter" title="Arrastrá para agrandar la terminal · doble clic: agrandar / restaurar"></div>
    <section id="terminals">
      <nav id="tabbar">
        <div id="tabs"></div>
        <button id="new-tab" title="Nueva pestaña: elegí la carpeta (⌘T)">+</button>
        <button id="toggle-max" title="Agrandar la terminal hacia arriba (⌘⇧Enter)">⤒</button>
      </nav>
      <main id="panes"></main>
    </section>
    <script src="renderer.js"></script>
  </body>
</html>
