[package]
name = "rollerterm-tauri"
version = "0.1.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
portable-pty = "0.9"
tokio = { version = "1", features = ["process", "time", "io-util", "sync", "macros"] }
chrono = "0.4"
notify-rust = "4"
uuid = { version = "1", features = ["v4"] }
tiny_http = "0.12"
ureq = "2"

# Binario lo más chico posible: es justamente lo que queremos medir.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
