<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>rollerterm (Tauri)</title>
    <link rel="stylesheet" href="xterm.css" />
    <style>
      :root {
        --bg: #13112b;
        --bar: #0d0b20;
        --fg: #e0def4;
        --muted: #8b87b5;
        --accent: #7c5cff;
      }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden;
        font: 13px system-ui, sans-serif; }
      body { display: flex; flex-direction: column; }
      #tabs { display: flex; align-items: stretch; background: var(--bar); height: 34px; flex: none;
        overflow-x: auto; }
      .tab { display: flex; align-items: center; gap: 8px; padding: 0 12px; color: var(--muted);
        border-right: 1px solid #ffffff10; cursor: default; white-space: nowrap; user-select: none; }
      .tab.active { color: var(--fg); background: var(--bg); box-shadow: inset 0 2px var(--accent); }
      .tab .close { opacity: .5; border: 0; background: none; color: inherit; cursor: pointer; padding: 0 2px; }
      .tab .close:hover { opacity: 1; }
      .tab input { background: transparent; color: inherit; border: 1px solid var(--accent); font: inherit;
        width: 140px; outline: none; }
      #new { border: 0; background: none; color: var(--muted); font-size: 18px; padding: 0 12px; cursor: pointer; }
      #new:hover { color: var(--fg); }
      #panes { flex: 1; position: relative; }
      .pane { position: absolute; inset: 6px 4px 4px 8px; display: none; }
      .pane.active { display: block; }
      #stats { position: fixed; right: 8px; bottom: 6px; color: var(--muted); font-size: 11px; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="tabs"><button id="new" title="Nueva pestaña (Ctrl+Shift+T)">+</button></div>
    <div id="panes"></div>
    <div id="stats"></div>
    <script src="main.js"></script>
  </body>
</html>
